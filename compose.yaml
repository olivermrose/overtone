services:
    postgres:
        image: postgres:18-alpine
        container_name: rankify
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - "5432:5432"
        volumes:
            - rankify-pgdata:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
            interval: 3s
            timeout: 3s
            retries: 10

volumes:
    rankify-pgdata:
